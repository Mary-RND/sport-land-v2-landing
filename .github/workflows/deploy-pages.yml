name: Deploy to GitHub Pages

# Публикует статический лендинг на GitHub Pages: файлы сайта из корня репозитория
# уходят в корень Pages — https://mary-rnd.github.io/sport-land-v2-landing/
# Скриншоты, README и лицензия в артефакт не попадают.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Pages artifact
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html script.js styles.css _site/
          cp -R images _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
